name: aria

services:
  aria-desktop:
    # Build from source locally
    build:
      context: ../packages/
      dockerfile: ariad/Dockerfile
    image: aria-desktop:local
    shm_size: "2g"
    container_name: aria-desktop
    restart: unless-stopped
    hostname: computer
    privileged: true
    ports:
      - "9990:9990" # ariad service & noVNC
      - "9867:9867" # PinchTab
    environment:
      - DISPLAY=:0
    volumes:
      - ../pinchtab-config.json:/home/user/.pinchtab/config.json
    networks:
      - aria-network

  postgres:
    image: postgres:16-alpine
    container_name: aria-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=ariadb
    networks:
      - aria-network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aria-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --appendfsync everysec
    networks:
      - aria-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  aria-agent:
    build:
      context: ../packages/
      dockerfile: aria-agent/Dockerfile
    image: aria-agent:local
    container_name: aria-agent
    restart: unless-stopped
    ports:
      - "9991:9991"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/ariadb}
      - ARIA_DESKTOP_BASE_URL=${ARIA_DESKTOP_BASE_URL:-http://aria-desktop:9990}
      - PINCHTAB_BASE_URL=${PINCHTAB_BASE_URL:-http://aria-desktop:9867}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - ENABLE_MULTI_AGENT=${ENABLE_MULTI_AGENT:-true}
      # Groq API Keys (Key Manager - automatic fallback)
      - GROQ_API_KEY_1=${GROQ_API_KEY_1}
      - GROQ_API_KEY_2=${GROQ_API_KEY_2}
      - GROQ_API_KEY_3=${GROQ_API_KEY_3}
      - GROQ_API_KEY_4=${GROQ_API_KEY_4}
      - GROQ_API_KEY_5=${GROQ_API_KEY_5}
      # Google API Keys (Key Manager - automatic fallback)
      - GOOGLE_API_KEY_1=${GOOGLE_API_KEY_1}
      - GOOGLE_API_KEY_2=${GOOGLE_API_KEY_2}
      - GOOGLE_API_KEY_3=${GOOGLE_API_KEY_3}
      - GOOGLE_API_KEY_4=${GOOGLE_API_KEY_4}
      - GOOGLE_API_KEY_5=${GOOGLE_API_KEY_5}
      # Bytez API Keys (Key Manager - automatic fallback)
      - BYTEZ_API_KEY_1=${BYTEZ_API_KEY_1}
      - BYTEZ_API_KEY_2=${BYTEZ_API_KEY_2}
      - BYTEZ_API_KEY_3=${BYTEZ_API_KEY_3}
      - BYTEZ_API_KEY_4=${BYTEZ_API_KEY_4}
      - BYTEZ_API_KEY_5=${BYTEZ_API_KEY_5}
      - BYTEZ_API_KEY_6=${BYTEZ_API_KEY_6}
      - BYTEZ_API_KEY_7=${BYTEZ_API_KEY_7}
      - BYTEZ_API_KEY_8=${BYTEZ_API_KEY_8}
      - BYTEZ_API_KEY_9=${BYTEZ_API_KEY_9}
      - BYTEZ_API_KEY_10=${BYTEZ_API_KEY_10}
      - BYTEZ_API_KEY_11=${BYTEZ_API_KEY_11}
      - BYTEZ_API_KEY_12=${BYTEZ_API_KEY_12}
      - BYTEZ_API_KEY_13=${BYTEZ_API_KEY_13}
      - BYTEZ_API_KEY_14=${BYTEZ_API_KEY_14}
      - BYTEZ_API_KEY_15=${BYTEZ_API_KEY_15}
      - BYTEZ_API_KEY_16=${BYTEZ_API_KEY_16}
      - BYTEZ_API_KEY_17=${BYTEZ_API_KEY_17}
      - BYTEZ_API_KEY_18=${BYTEZ_API_KEY_18}
      - BYTEZ_API_KEY_19=${BYTEZ_API_KEY_19}
      - BYTEZ_API_KEY_20=${BYTEZ_API_KEY_20}
      # Optional
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - PINCHTAB_HEADED_MODE=${PINCHTAB_HEADED_MODE}
    depends_on:
      - postgres
      - redis
      - aria-desktop
    networks:
      - aria-network

  aria-ui:
    build:
      context: ../packages/
      dockerfile: aria-ui/Dockerfile
      cache_from:
        - aria-ui:local
      args:
        - ARIA_AGENT_BASE_URL=${ARIA_AGENT_BASE_URL:-http://aria-agent:9991}
        - ARIA_DESKTOP_VNC_URL=${ARIA_DESKTOP_VNC_URL:-http://aria-desktop:9990/websockify}
    image: aria-ui:local
    container_name: aria-ui
    restart: unless-stopped
    ports:
      - "9992:9992"
    environment:
      - NODE_ENV=production
      - ARIA_AGENT_BASE_URL=${ARIA_AGENT_BASE_URL:-http://aria-agent:9991}
      - ARIA_DESKTOP_VNC_URL=${ARIA_DESKTOP_VNC_URL:-http://aria-desktop:9990/websockify}
    depends_on:
      - aria-agent
    networks:
      - aria-network

networks:
  aria-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
