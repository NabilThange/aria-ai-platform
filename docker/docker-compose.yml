name: aria

services:
  aria-desktop:
    # Build from source
    build:
      context: ../packages/
      dockerfile: ariad/Dockerfile
    # Use pre-built image (commented out - build from source)
    # image: ghcr.io/aria-ai/aria-desktop:edge
    shm_size: "2g"
    container_name: aria-desktop
    restart: unless-stopped
    hostname: computer
    privileged: true
    ports:
      - "9990:9990" # ariad service & noVNC
    environment:
      - DISPLAY=:0
    networks:
      - aria-network

  postgres:
    image: postgres:16-alpine
    container_name: aria-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=ariadb
    networks:
      - aria-network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  aria-agent:
    build:
      context: ../packages/
      dockerfile: aria-agent/Dockerfile
    # Use pre-built image
    image: ghcr.io/aria-ai/aria-agent:edge
    container_name: aria-agent
    restart: unless-stopped
    ports:
      - "9991:9991"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/ariadb}
      - ARIA_DESKTOP_BASE_URL=${ARIA_DESKTOP_BASE_URL:-http://aria-desktop:9990}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
    depends_on:
      - postgres
    networks:
      - aria-network

  aria-ui:
    build:
      context: ../packages/
      dockerfile: aria-ui/Dockerfile
      args:
        - ARIA_AGENT_BASE_URL=${ARIA_AGENT_BASE_URL:-http://aria-agent:9991}
        - ARIA_DESKTOP_VNC_URL=${ARIA_DESKTOP_VNC_URL:-http://aria-desktop:9990/websockify}
    # Use pre-built image
    image: ghcr.io/aria-ai/aria-ui:edge
    container_name: aria-ui
    restart: unless-stopped
    ports:
      - "9992:9992"
    environment:
      - NODE_ENV=production
      - ARIA_AGENT_BASE_URL=${ARIA_AGENT_BASE_URL:-http://aria-agent:9991}
      - ARIA_DESKTOP_VNC_URL=${ARIA_DESKTOP_VNC_URL:-http://aria-desktop:9990/websockify}
    depends_on:
      - aria-agent
    networks:
      - aria-network

networks:
  aria-network:
    driver: bridge

volumes:
  postgres_data:
