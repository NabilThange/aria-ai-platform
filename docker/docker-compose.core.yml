name: aria

services:
  aria-desktop:
    # Build from source (packages/ariad/Dockerfile)
    build:
      context: ../packages
      dockerfile: ariad/Dockerfile
    # Use pre-built image (commented out - build from source instead)
    # image: ghcr.io/aria-ai/aria-desktop:edge
    shm_size: "2g"
    container_name: aria-desktop
    restart: unless-stopped
    hostname: computer
    privileged: true
    ports:
      - "9990:9990" # ariad service & noVNC
      - "9867:9867" # PinchTab
    environment:
      - DISPLAY=:0
