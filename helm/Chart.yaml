apiVersion: v2
name: bytebot
description: Bytebot - Complete deployment package
type: application
version: 0.1.0
appVersion: "edge"
dependencies:
  - name: postgresql
    version: 0.1.0
    repository: file://./charts/postgresql
    condition: postgresql.enabled
  - name: aria-desktop
    version: 0.1.0
    repository: file://./charts/aria-desktop
  - name: aria-agent
    version: 0.1.0
    repository: file://./charts/aria-agent
  - name: aria-ui
    version: 0.1.0
    repository: file://./charts/aria-ui
  - name: aria-llm-proxy
    version: 0.1.0
    repository: file://./charts/aria-llm-proxy
    condition: aria-llm-proxy.enabled
keywords:
  - bytebot
  - automation
  - remote-desktop
maintainers:
  - name: Bytebot Team
sources:
  - https://github.com/aria-ai/bytebot
